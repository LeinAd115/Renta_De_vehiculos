{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Iniciar Sesión</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('vista_login') }}">
                    <div class="mb-3">
                        <label class="form-label">Usuario:</label>
                        <input type="text" name="usuario" class="form-control" required placeholder="Ingresa tu usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="password" name="contrasena" class="form-control" required placeholder="Ingresa tu contraseña">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                </form>

                <hr>

                <div class="text-center">
                    <button class="btn btn-link btn-sm text-decoration-none" type="button" data-bs-toggle="collapse" data-bs-target="#restablecerClave">
                        ¿Olvidaste tu contraseña? Restablecer
                    </button>
                </div>

                <div class="collapse mt-3" id="restablecerClave">
                    <div class="card card-body bg-light">
                        <form method="POST" action="{{ url_for('restablecer') }}">
                            <div class="mb-2">
                                <label class="form-label small">Usuario para recuperar:</label>
                                <input type="text" name="usuario" class="form-control form-control-sm" required>
                            </div>
                            <button type="submit" class="btn btn-secondary btn-sm w-100">Enviar nueva clave</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
