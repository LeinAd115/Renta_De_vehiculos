<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
    <title>Renta Activa – Punto de Renta</title>
</head>
<body>

    <header>
        <h1>&#x2302; Punto de Renta</h1>
        <div class="user-info">
            <a href="/punto_renta" class="btn-volver">← Volver</a>
            <span>{{ session['usuario'] }}</span>
            <a href="/logout">Cerrar sesión</a>
        </div>
    </header>

    <main>
        <h2>Renta Activa</h2>

        <!-- Métricas rápidas -->
        <div class="metrics-row">
            <div class="metric-card">
                <div class="metric-value" id="totalActivas">0</div>
                <div class="metric-label">Rentas activas</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="totalHoy">$0</div>
                <div class="metric-label">Cobrado hoy</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="totalPendiente">0</div>
                <div class="metric-label">Por vencer hoy</div>
            </div>
        </div>

        <!-- Formulario nueva renta -->
        <div class="card">
            <div class="section-title">Nueva Renta</div>
            <div id="msgNuevaRenta"></div>

            <div class="form-row">
                <div class="form-group">
                    <label>Cliente</label>
                    <input type="text" id="cliente" placeholder="Nombre del cliente">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefono" placeholder="10 dígitos">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Artículo / Descripción</label>
                    <input type="text" id="articulo" placeholder="Ej. Mesa redonda x6">
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="cantidad" placeholder="1" min="1">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha de entrega</label>
                    <input type="date" id="fechaEntrega">
                </div>
                <div class="form-group">
                    <label>Fecha de devolución</label>
                    <input type="date" id="fechaDevolucion">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Precio total ($)</label>
                    <input type="number" id="precio" placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>Anticipo ($)</label>
                    <input type="number" id="anticipo" placeholder="0.00" min="0" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>Notas (opcional)</label>
                <textarea id="notas" rows="2" placeholder="Indicaciones especiales..."></textarea>
            </div>

            <div style="display:flex; gap:10px; margin-top:4px;">
                <button class="btn" onclick="registrarRenta()">Registrar Renta</button>
                <button class="btn-secondary" onclick="limpiarFormulario()">Limpiar</button>
            </div>
        </div>

        <!-- Lista de rentas activas -->
        <div class="card">
            <div class="section-title">Rentas en Curso</div>

            <div style="display:flex; gap:10px; margin-bottom:14px;">
                <input type="text" id="buscarRenta" placeholder="Buscar por cliente o artículo..."
                    style="flex:1; padding:8px 12px; border-radius:6px; border:1.5px solid #c8ca89; font-size:0.88rem;"
                    oninput="filtrarRentas()">
                <button class="btn-secondary" onclick="cargarRentas()">Actualizar</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Cliente</th>
                            <th>Artículo</th>
                            <th>Cant.</th>
                            <th>Devolución</th>
                            <th>Total</th>
                            <th>Saldo</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaRentas">
                        <tr><td colspan="9" style="text-align:center; color:#999; padding:20px;">Cargando rentas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Establece fecha mínima = hoy
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fechaEntrega').value = hoy;
        document.getElementById('fechaEntrega').min = hoy;
        document.getElementById('fechaDevolucion').min = hoy;

        async function registrarRenta() {
            const datos = {
                cliente:        document.getElementById('cliente').value.trim(),
                telefono:       document.getElementById('telefono').value.trim(),
                articulo:       document.getElementById('articulo').value.trim(),
                cantidad:       document.getElementById('cantidad').value,
                fecha_entrega:  document.getElementById('fechaEntrega').value,
                fecha_devolucion: document.getElementById('fechaDevolucion').value,
                precio:         document.getElementById('precio').value,
                anticipo:       document.getElementById('anticipo').value,
                notas:          document.getElementById('notas').value.trim()
            };

            if (!datos.cliente || !datos.articulo || !datos.fecha_devolucion || !datos.precio) {
                mostrarMsg('msgNuevaRenta', 'Completa los campos obligatorios.', 'error');
                return;
            }

            try {
                const resp = await fetch('/registrar_renta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const res = await resp.json();
                if (res.success) {
                    mostrarMsg('msgNuevaRenta', 'Renta registrada correctamente.', 'success');
                    limpiarFormulario();
                    cargarRentas();
                } else {
                    mostrarMsg('msgNuevaRenta', res.mensaje || 'Error al registrar.', 'error');
                }
            } catch(e) {
                mostrarMsg('msgNuevaRenta', 'Error de conexión.', 'error');
            }
        }

        async function cargarRentas() {
            try {
                const resp = await fetch('/obtener_rentas_activas');
                const data = await resp.json();
                renderTabla(data.rentas || []);
                actualizarMetricas(data.rentas || []);
            } catch(e) {
                document.getElementById('tablaRentas').innerHTML =
                    '<tr><td colspan="9" style="text-align:center;color:#e74c3c;">Error al cargar.</td></tr>';
            }
        }

        let _rentas = [];

        function renderTabla(rentas) {
            _rentas = rentas;
            const tbody = document.getElementById('tablaRentas');
            if (!rentas.length) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;padding:20px;">Sin rentas activas.</td></tr>';
                return;
            }
            tbody.innerHTML = rentas.map((r, i) => {
                const saldo = (parseFloat(r.precio) - parseFloat(r.anticipo || 0)).toFixed(2);
                const vence = new Date(r.fecha_devolucion).toLocaleDateString('es-MX');
                const hoyMs = new Date().setHours(0,0,0,0);
                const venceMs = new Date(r.fecha_devolucion).setHours(0,0,0,0);
                const badge = venceMs < hoyMs
                    ? '<span class="badge badge-inactivo">Vencida</span>'
                    : venceMs === hoyMs
                        ? '<span class="badge badge-pendiente">Hoy</span>'
                        : '<span class="badge badge-activo">Activa</span>';
                return `<tr>
                    <td>${i+1}</td>
                    <td><strong>${r.cliente}</strong><br><small style="color:#999">${r.telefono||''}</small></td>
                    <td>${r.articulo}</td>
                    <td style="text-align:center">${r.cantidad}</td>
                    <td>${vence}</td>
                    <td>$${parseFloat(r.precio).toFixed(2)}</td>
                    <td style="color:${saldo>0?'#c0392b':'#27ae60'}; font-weight:bold">$${saldo}</td>
                    <td>${badge}</td>
                    <td>
                        <button class="btn" style="padding:5px 12px; font-size:0.78rem;"
                            onclick="devolverRenta(${r.id})">Devolver</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function filtrarRentas() {
            const q = document.getElementById('buscarRenta').value.toLowerCase();
            const filtradas = _rentas.filter(r =>
                r.cliente.toLowerCase().includes(q) ||
                r.articulo.toLowerCase().includes(q)
            );
            renderTabla(filtradas);
        }

        function actualizarMetricas(rentas) {
            document.getElementById('totalActivas').textContent = rentas.length;
            const cobradoHoy = rentas.reduce((s, r) => s + parseFloat(r.anticipo||0), 0);
            document.getElementById('totalHoy').textContent = '$' + cobradoHoy.toFixed(2);
            const hoyMs = new Date().setHours(0,0,0,0);
            const porVencer = rentas.filter(r => new Date(r.fecha_devolucion).setHours(0,0,0,0) === hoyMs).length;
            document.getElementById('totalPendiente').textContent = porVencer;
        }

        async function devolverRenta(id) {
            if (!confirm('¿Marcar esta renta como devuelta?')) return;
            try {
                const resp = await fetch('/devolver_renta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const res = await resp.json();
                if (res.success) cargarRentas();
                else alert(res.mensaje || 'Error');
            } catch(e) { alert('Error de conexión'); }
        }

        function limpiarFormulario() {
            ['cliente','telefono','articulo','cantidad','fechaDevolucion','precio','anticipo','notas']
                .forEach(id => document.getElementById(id).value = '');
            document.getElementById('fechaEntrega').value = hoy;
        }

        function mostrarMsg(id, texto, tipo) {
            const el = document.getElementById(id);
            el.innerHTML = `<div class="alert alert-${tipo === 'error' ? 'error' : 'success'}">${texto}</div>`;
            setTimeout(() => el.innerHTML = '', 4000);
        }

        cargarRentas();
    </script>
</body>
</html>
